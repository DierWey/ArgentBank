swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      #produces:
       # - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /transactions/{account_id}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Transactions API
      description: API for fetching all transactions for a specific account
      parameters:
        - in: path
          type: integer
          name: account_id
          required: true
          description: account ID
        - in: query
          type: string
          name: month
          required: false
          description: selected month
      #produces:
       # - application/json
      responses:
        200:
          description: Transactions retrieved successfully
          schema: 
            $ref: "#/definitions/Transactions_response"
        400:
          description: Invalid Fields
        404:
          description: Account not found
        500:
          description: Internal Server Error
  
  /transaction/{transaction_id}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Specific transaction API
      description: API for fetching a specific transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          type: integer
      responses:
        200:
          description: Transaction retrieved successfully
          schema: 
            $ref: "#/definitions/Transaction_response"
        400:
          description: Invalid Fields
        404:
          description: Transaction not found
        500:
          description: Internal Server Error
    patch:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Specific transaction API
      description: API for updating category and note for a specific transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          type: integer
        - in: body
          name: body
          required: true
          description: Fields to update or delete
          schema:
            $ref: '#/definitions/TransactionPatch'
      responses:
        200:
          description: Transaction patched successfully
        400:
          description: Invalid Fields
        404:
          description: Transaction not found
        500:
          description: Internal Server Error

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
      userName:
        type: string
        description: user public name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      userName:
        type: string

  Transactions_response:
    type: array
    items:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        body: 
          $ref: "#/definitions/Transaction"

  Transaction_response:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body: 
        $ref: "#/definitions/Transaction"

  Transaction:
    type: object
    properties:
      date:
        type: string
        description: transaction date
      description:
        type: string
        description: transaction description
      amount:
        type: string
        description: transaction amount
      balance:
        type: string
        description: transaction balance
      type:
        type: string
        description: transaction type
      category:
        type: string
        description: transaction category
      note:
        type: string
        description: transaction note

  TransactionPatch:
    type: object
    properties:
      category_id:
        type: integer
      note:
        type: string
        # maxLength: dépend du varChar définidans le backend. 1024 caractères ?
  
